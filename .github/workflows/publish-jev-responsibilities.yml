name: Validate and publish Jev responsibility diagram

on:
  push:
    branches:
      - redesign/jev-responsibility-comparison

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/jev-responsibility-comparison

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install content sync and React dependencies
        working-directory: preview/handbook-custom
        run: |
          python -m pip install -r scripts/requirements.txt
          npm install --no-audit --no-fund

      - name: Sync source-backed figure fallback
        working-directory: preview/handbook-custom
        run: npm run sync-content

      - name: Build React preview
        working-directory: preview/handbook-custom
        run: npm run build

      - name: Install Chromium
        working-directory: preview/handbook-custom
        run: npx playwright install --with-deps chromium

      - name: Run Jev responsive and accessibility tests
        working-directory: preview/handbook-custom
        run: |
          npm run dev -- --port 4180 > /tmp/handbook-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/ >/dev/null; then break; fi
            sleep 2
          done
          node evidence/jev-flow-comparison.cjs

      - name: Publish production web/site
        working-directory: preview/handbook-custom
        run: npm run publish:web

      - name: Commit generated content and production artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -A preview/handbook-custom/public/content             preview/handbook-custom/src/search-index.json             preview/handbook-custom/src/chapters.json             preview/handbook-custom/evidence/content-manifest.json web/site
          if git diff --cached --quiet; then
            echo "Generated output is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish Before After Jev comparison"
          git push origin HEAD:redesign/jev-responsibility-comparison
