name: Build Context Budget Chapter Once

on:
  push:
    branches:
      - content/context-budget-compaction-offload-cache-2026-10-13

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated context budget]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/context-budget-compaction-offload-cache-2026-10-13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - name: Install content generator dependency
        run: python3 -m pip install beautifulsoup4
      # Reuse the checked-in 12-chapter registry. Legacy rebuild currently fails on Chapter 11 metadata.
      - name: Install site dependencies
        working-directory: preview/handbook-custom
        run: npm ci
      - name: Sync canonical chapter and registered fragments
        working-directory: preview/handbook-custom
        run: npm run sync-content
      - name: Publish production site
        working-directory: preview/handbook-custom
        run: npm run publish:web
      - name: Validate published structure
        run: node web/validate.mjs
      - name: Verify bilingual Context Budget content
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('web/site/content/07-memory-context-engineering.json').read_text())
          assert 'context-budget-prefix-cache' in data['supplements']
          assert 'context-budget-cache-strategy' in data['zh']
          assert 'context-budget-cache-strategy' in data['en']
          for fid in ('fig-7-b1','fig-7-b2','fig-7-b3'):
              assert fid in data['zh'] and fid in data['en']
          assert 'Compaction' in data['en'] and 'Offloading' in data['en']
          search=json.loads(Path('web/site/content/search-index.json').read_text())
          assert any('07-memory-context-engineering' in item.get('href','') and 'context-budget-cache-strategy' in item.get('href','') for item in search)
          print('PASS: bilingual diagrams + section search')
          PY
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web preview/handbook-custom/src preview/handbook-custom/public preview/handbook-custom/evidence/content-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: generate Context Budget site [generated context budget]"
          git push origin HEAD:content/context-budget-compaction-offload-cache-2026-10-13
