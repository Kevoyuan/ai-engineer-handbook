name: FDE Stage 07 manual gap audit and Reader QA (no deployment)
on:
  push:
    branches: [content/fde-02-04-system-data-audit-20261008]
    paths: [.github/workflows/fde-stage07-audit-qa-once.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - name: Run stdlib FDE production and coding contract tests
        working-directory: examples/fde-interview-engineering
        run: python3 -m unittest discover -s tests -v
      - name: Verify all 167 concept names, actual heading pointers and Q10-Q64 chapter ownership
        run: python3 scripts/verify_fde_coverage.py
      - name: Install parser and JS dependencies for local preview build only
        run: |
          python3 -m pip install beautifulsoup4
          cd preview/handbook-custom
          npm install --no-audit --no-fund
      - name: Rebuild bilingual Reader and React without web/site or Vercel
        working-directory: preview/handbook-custom
        run: |
          npm run sync-content
          npm run build
      - name: Verify seven bilingual fragments, all 25 questions and search
        run: |
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import json
          base=Path('preview/handbook-custom/public/content')
          index=json.loads((base/'search-index.json').read_text())
          registry=json.loads(Path('web/assets/chapter-additions.json').read_text())
          groups=[
            ('01-model-api-context-foundations','fde-stage07-model',[58,59,60,61,62]),
            ('02-enterprise-retrieval','fde-stage07-retrieval',[40,41,42,43]),
            ('03-hybrid-retrieval-query-routing','fde-stage07-query',[44]),
            ('06-skills-routing','fde-stage07-protocols',[45,46]),
            ('07-memory-context-engineering','fde-stage07-context',[47]),
            ('10-serving-deployment-ai-platform','fde-stage07-serving',[48,49,50,51,52,53,54,55,63,64]),
            ('11-data-sql-engineering','fde-stage07-data',[56,57]),
          ]
          assert sum(len(q) for _,_,q in groups)==25
          for chapter,frag,questions in groups:
              assert any(x['id']==frag for x in registry[chapter]),(chapter,'not registered')
              doc=json.loads((base/(chapter+'.json')).read_text())
              assert frag in doc['supplements'],(chapter,'not supplemented')
              assert any(x.get('href')=='#read/'+chapter+'/'+frag+'-title' for x in index),(chapter,'not indexed')
              for lang in ('zh','en'):
                  parsed=BeautifulSoup(doc[lang],'html.parser')
                  root=parsed.find(id=frag)
                  assert root,(chapter,lang,'missing root')
                  for q in questions:
                      assert root.find(id=f'{frag}-q{q}'),(chapter,lang,q)
                  assert len(root.select('h3[id]'))==len(questions),(chapter,lang,'question count')
                  assert len(root.select('a[href^="https://"]'))>=1,(chapter,lang,'source')
                  assert len(root.get_text(' ',strip=True))>=240,(chapter,lang,'empty text')
                  print(chapter,lang,'OK',len(questions))
          assert not any(x.name.startswith('fde-05-06-qa-once') for x in Path('.github/workflows').glob('*'))
          assert Path('handbook/references/fde-2026-answers-07-provenance.md').exists()
          print('PASS 25 new FDE answers, 7 bilingual Reader sections, search')
          PY
      - name: Commit only review-branch Reader JSON and search artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/handbook-custom/public/content preview/handbook-custom/src/search-index.json preview/handbook-custom/evidence/content-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync stage07 bilingual FDE gap review on Draft branch"
            git push origin HEAD:content/fde-02-04-system-data-audit-20261008
          fi
