name: Build and test Jev dual flows once

on:
  push:
    branches:
      - web/jev-dual-flow-animation-2026-10-08

permissions:
  contents: write

jobs:
  build-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[generated jev dual]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/jev-dual-flow-animation-2026-10-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - name: Python dependency
        run: python3 -m pip install beautifulsoup4
      - name: Legacy search and registry
        run: node web/rebuild.mjs
      - name: Dependencies
        run: npm ci
        working-directory: preview/handbook-custom
      - name: Canonical content sync
        run: npm run sync-content
        working-directory: preview/handbook-custom
      - name: Build production bundle
        run: npm run build
        working-directory: preview/handbook-custom
      - name: Publish web artifact
        run: npm run publish:web
        working-directory: preview/handbook-custom
      - name: Structural validation
        run: node web/validate.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: preview/handbook-custom
      - name: Test paired flow in browser
        working-directory: preview/handbook-custom
        run: |
          npx vite preview --host 127.0.0.1 --port 4180 > /tmp/jev-vite.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -sf http://127.0.0.1:4180/ >/dev/null; then break; fi
            sleep 1
          done
          node evidence/jev-flow-comparison.cjs
      - name: Commit generated web artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web preview/handbook-custom/src preview/handbook-custom/public preview/handbook-custom/evidence/content-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: generate Jev dual flow web build [generated jev dual]"
          git push origin HEAD:web/jev-dual-flow-animation-2026-10-08
