name: Validate and publish immersive Reader

on:
  push:
    branches:
      - feat/immersive-reader-chrome

permissions:
  contents: write

jobs:
  browser-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/immersive-reader-chrome

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: preview/handbook-custom
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: preview/handbook-custom
        run: npx playwright install --with-deps chromium

      - name: Build and test Reader interactions
        working-directory: preview/handbook-custom
        run: |
          npm run build
          npm run dev -- --port 4180 > /tmp/handbook-vite.log 2>&1 &
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4180/ >/dev/null; then break; fi
            sleep 2
          done
          npm run test:ui

      - name: Refresh web/site deployment artifact
        working-directory: preview/handbook-custom
        run: npm run publish:web

      - name: Commit generated artifact
        shell: bash
        run: |
          set -euo pipefail
          git add -A web/site
          if git diff --cached --quiet; then
            echo "web/site already matches source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish immersive Reader chrome"
          git push origin HEAD:feat/immersive-reader-chrome
