name: One-time publish source-verified FDE answers
on:
  push:
    branches: [content/fde-source-verified-answers-20261008]
    paths:
      - .github/workflows/fde-verified-publish-once.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install HTML transform dependency
        run: python3 -m pip install beautifulsoup4
      - name: Generate and build complete bilingual Atlas
        working-directory: preview/handbook-custom
        run: |
          npm install --no-audit --no-fund
          npm run sync-content
          npm run build
          npm run publish:web
      - name: Validate nine answers, source notes and indexed bilingual chapters
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          spec=[
              ('02-enterprise-retrieval','fde-verified-permission-rag','fde-qa-auth',3),
              ('09-reliability-evaluation-observability','fde-verified-eval-harness','fde-qa-rag-eval',4),
              ('10-serving-deployment-ai-platform','fde-verified-retry-idempotency','fde-qa-side-effect',2),
          ]
          registry=json.loads(Path('web/assets/chapter-additions.json').read_text())
          ledger=Path('handbook/references/fde-2026-verified-answer-ledger.md').read_text()
          assert all('Q'+str(i) in ledger for i in range(1,10))
          total=0
          for root in ('preview/handbook-custom/public/content','web/site/content'):
              base=Path(root)
              search=json.loads((base/'search-index.json').read_text())
              for chapter,fragment,question,count in spec:
                  payload=json.loads((base/(chapter+'.json')).read_text())
                  assert fragment in payload['supplements'],(root,chapter,'registration')
                  for language in ('zh','en'):
                      doc=BeautifulSoup(payload[language],'html.parser')
                      sec=doc.find(id=fragment)
                      assert sec,(root,chapter,language,'missing fragment')
                      assert sec.find(id=question)
                      assert len(sec.select('h3'))==count,(root,chapter,language,'q count')
                      assert len(sec.select('a[href^="https://"]'))>=2,(root,chapter,language,'sources')
                      if language=='en':
                          assert 'independently' in sec.get_text(' ',strip=True).lower()
                  assert any(x['href']=='#read/'+chapter+'/'+fragment+'-title' for x in search),(root,chapter,'search')
                  total+=count
                  print(root,chapter,count,'verified QAs, 2 locales + search OK')
          assert total==18, total
          assert Path('web/site/index.html').exists()
          print('Published build and nine bilingual questions verified.')
          PY
      - name: Commit generated reader and deploy assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/handbook-custom/src/search-index.json preview/handbook-custom/public/content preview/handbook-custom/evidence/content-manifest.json web/site
          if ! git diff --cached --quiet; then
            git commit -m "build: publish bilingual source-verified FDE answers"
            git push origin HEAD:content/fde-source-verified-answers-20261008
          fi
