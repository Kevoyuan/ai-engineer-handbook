name: One-time FDE order investigation capstone build
on:
  push:
    branches: [content/fde-order-copilot-capstone-20261008]
    paths:
      - .github/workflows/fde-order-capstone-publish-once.yml
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run deterministic FDE fixture tests
        working-directory: examples/fde-order-copilot
        run: |
          python3 -m unittest discover -s tests -v
          python3 copilot.py > /tmp/fde-demo.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cases=json.loads(Path('/tmp/fde-demo.json').read_text())
          assert [x['status'] for x in cases] == ['ANOMALY','CONSISTENT']
          assert all(x['read_only'] and len(x['evidence'])==2 for x in cases)
          assert all({e['source_event_id'][0] for e in case['evidence']} == {prefix} for case,prefix in zip(cases,['a','b']))
          print('FDE fixture output and tenant-specific evidence verified')
          PY
      - name: Install content parser and web dependencies
        run: |
          python3 -m pip install beautifulsoup4
          cd preview/handbook-custom
          npm install --no-audit --no-fund
      - name: Generate bilingual content and publish React site
        working-directory: preview/handbook-custom
        run: |
          npm run sync-content
          npm run build
          npm run publish:web
      - name: Verify bilingual chapter topology, search and source boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          chapter='12-fde-customer-delivery'
          supplement='fde-order-investigation-capstone'
          expected=[
              'fde-order-capstone-title','fde-order-discovery',
              'fde-order-topology','fde-order-data',
              'fde-order-routing','fde-order-example',
              'fde-order-failure','fde-order-acceptance',
              'fde-order-handoff'
          ]
          registry=json.loads(Path('web/assets/chapter-additions.json').read_text())
          assert any(x['id']==supplement for x in registry[chapter])
          for base_name in ('preview/handbook-custom/public/content','web/site/content'):
              base=Path(base_name)
              payload=json.loads((base/(chapter+'.json')).read_text())
              assert supplement in payload['supplements'],(base_name,'missing supplement')
              search=json.loads((base/'search-index.json').read_text())
              assert any(x['href']=='#read/'+chapter+'/fde-order-capstone-title' for x in search),(base_name,'missing search')
              assert len(payload['sections']) >= 19,(base_name,'sections',len(payload['sections']))
              for locale in ('zh','en'):
                  doc=BeautifulSoup(payload[locale],'html.parser')
                  for id in expected:
                      assert doc.find(id=id),(base_name,locale,'missing',id)
                  fig=doc.select_one('#fde-order-topology + .bfs-canvas')
                  assert fig and len(fig.select('.bfs-card'))==9,(base_name,locale,'topology')
                  assert len(doc.select('#fde-order-investigation-capstone details'))==4,(base_name,locale,'faults')
                  text=doc.find(id=supplement).get_text(' ',strip=True)
                  assert len(text)>2500,(base_name,locale,'text too short')
                  if locale=='en':
                      assert 'Customer' in text or 'customer' in text
                  print(base_name,locale,len(text),'chars, architecture/sections/faults OK')
          assert Path('web/site/index.html').exists()
          print('FDE order capstone published artifacts verified')
          PY
      - name: Commit production assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/handbook-custom/public/content preview/handbook-custom/src/search-index.json preview/handbook-custom/evidence/content-manifest.json web/site
          if ! git diff --cached --quiet; then
            git commit -m "build: publish bilingual enterprise FDE capstone"
            git push origin HEAD:content/fde-order-copilot-capstone-20261008
          fi
