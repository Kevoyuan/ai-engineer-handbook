name: Final production build for PR70 (no deployment in CI)
on:
  push:
    branches: [content/fde-02-04-system-data-audit-20261008]
    paths: [.github/workflows/fde-pr70-release-build.yml]
permissions:
  contents: write
jobs:
  publish-reviewed-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install content tools
        run: python3 -m pip install beautifulsoup4
      - name: Verify provenance and coding contracts
        run: |
          python3 scripts/verify_fde_coverage.py
          python3 scripts/verify_fde_readiness.py
          (cd examples/fde-interview-engineering && python3 -m unittest discover -s tests -v)
          (cd examples/fde-order-copilot && python3 -m unittest discover -s tests -v)
      - name: Build authoritative release artifacts
        working-directory: preview/handbook-custom
        run: |
          npm install --no-audit --no-fund
          npm run sync-content
          npm run build
          npm run publish:web
      - name: Validate published site and bilingual Reader/search
        run: |
          node web/validate.mjs
          node --check web/rebuild.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          assets=Path('web/site')
          assert (assets/'index.html').exists()
          site=assets/'content'
          preview=Path('preview/handbook-custom/public/content')
          index=json.loads((site/'search-index.json').read_text())
          assert any(x.get('href')=='#read/12-fde-customer-delivery/fde-readiness-audit-08-title' for x in index)
          plans=[
            ('01-model-api-context-foundations','fde-stage07-model'),
            ('02-enterprise-retrieval','fde-stage07-retrieval'),
            ('03-hybrid-retrieval-query-routing','fde-stage07-query'),
            ('06-skills-routing','fde-stage07-protocols'),
            ('07-memory-context-engineering','fde-stage07-context'),
            ('10-serving-deployment-ai-platform','fde-stage07-serving'),
            ('11-data-sql-engineering','fde-stage07-data'),
            ('12-fde-customer-delivery','fde-readiness-audit-08')
          ]
          for chapter,frag in plans:
              p=site/(chapter+'.json')
              assert p.exists(),p
              payload=json.loads(p.read_text())
              original=json.loads((preview/(chapter+'.json')).read_text())
              assert payload['supplements']==original['supplements'],chapter
              for lang in ['zh','en']:
                  root=BeautifulSoup(payload[lang],'html.parser').find(id=frag)
                  assert root, (chapter,frag,lang)
                  if frag=='fde-readiness-audit-08':
                      assert len(root.select('details'))==40
                      for i in range(1,37):
                          assert f'R{i:02d}' in root.get_text(' ',strip=True)
              print('release ready',chapter,frag)
          print('PASS: published content + search and eight chapter smoke checks')
          PY
      - name: Commit production artifact to feature branch (not deploy)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/site preview/handbook-custom/public/content preview/handbook-custom/src/search-index.json preview/handbook-custom/evidence/content-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(release): publish Q10–Q64 and core36 Atlas content to web/site"
            git fetch origin content/fde-02-04-system-data-audit-20261008
            git rebase origin/content/fde-02-04-system-data-audit-20261008
            git push origin HEAD:content/fde-02-04-system-data-audit-20261008
          fi
