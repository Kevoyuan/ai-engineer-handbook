name: Atlas V2 verified release build
on:
  push:
    branches:
      - web/visualization-v2-ch10-11-20261009
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-v2-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install content synchronization dependencies
        run: python -m pip install -r preview/handbook-custom/scripts/requirements.txt
      - name: Install locked React dependencies
        run: npm ci --prefix preview/handbook-custom
      - name: Synchronize canonical chapter content
        run: npm run sync-content --prefix preview/handbook-custom
      - name: Validate generated Atlas registry
        run: npm run test:atlas --prefix preview/handbook-custom
      - name: Validate interactive visualization contracts
        run: npm run test:visualizations --prefix preview/handbook-custom
      - name: Compile TypeScript and build application
        run: npm run build --prefix preview/handbook-custom
      - name: Publish generated web/site assets
        run: npm run publish:web --prefix preview/handbook-custom
      - name: Verify all canonical and deployed references
        run: node web/validate.mjs
      - name: Check generated lesson bundles exist
        run: |
          test -f web/site/index.html
          test -d web/site/assets
          grep -R -l 'When is prefix KV reusable' web/site/assets/ >/dev/null
          grep -R -l 'Where does the data contract hold' web/site/assets/ >/dev/null
      - name: Commit verified generated site to release branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A web/site preview/handbook-custom/src preview/handbook-custom/public preview/handbook-custom/evidence/content-manifest.json
          if git diff --cached --quiet; then
            echo "Generated artifact matches committed files."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: publish verified Atlas V2 site bundle'
          git push origin HEAD:${GITHUB_REF_NAME}
