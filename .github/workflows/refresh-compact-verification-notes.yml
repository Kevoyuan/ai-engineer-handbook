name: Refresh compact verification notes

on:
  push:
    branches:
      - fix/compact-verification-notes

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/compact-verification-notes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: preview/handbook-custom
        run: |
          python -m pip install -r scripts/requirements.txt
          npm install --no-audit --no-fund

      - name: Regenerate content
        working-directory: preview/handbook-custom
        run: npm run sync-content

      - name: Verify verification notes are native disclosures
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("preview/handbook-custom/public/content/06-skills-routing.json")
          data=json.loads(p.read_text())
          for lang in ("zh","en"):
              html=data[lang]
              assert '<details class="co note verification-note"' in html, lang
              assert '<summary class="co-t">' in html, lang
          print("verification disclosures present in zh/en")
          PY

      - name: Publish production artifact
        working-directory: preview/handbook-custom
        run: npm run publish:web

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Generated artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/handbook-custom/public/content                   preview/handbook-custom/src/search-index.json                   preview/handbook-custom/evidence/content-manifest.json                   web/site
          git commit -m "build: publish compact verification disclosures"
          git push origin HEAD:fix/compact-verification-notes
