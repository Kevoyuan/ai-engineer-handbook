name: Build cancellation chapter once

on:
  push:
    branches:
      - content/agent-cancellation-steering-2026-10-06

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated cancellation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/agent-cancellation-steering-2026-10-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - name: Install Python dependency
        run: python3 -m pip install beautifulsoup4
      - name: Rebuild legacy registry and search
        run: node web/rebuild.mjs
      - name: Install preview dependencies
        working-directory: preview/handbook-custom
        run: npm ci
      - name: Sync canonical content
        working-directory: preview/handbook-custom
        run: npm run sync-content
      - name: Publish SPA build
        working-directory: preview/handbook-custom
        run: npm run publish:web
      - name: Validate published structure
        run: node web/validate.mjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982c8+github-actions[bot]@users.noreply.github.com"
          git add web preview/handbook-custom/src preview/handbook-custom/public preview/handbook-custom/evidence/content-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: generate cancellation and steering web build [generated cancellation]"
          git push origin HEAD:content/agent-cancellation-steering-2026-10-06
