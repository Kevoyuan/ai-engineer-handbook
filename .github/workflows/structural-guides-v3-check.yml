name: Structural Guide V3 · source and visual review
on:
  push:
    branches:
      - design/structural-atlas-ch05-09-12-20261009
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structural-guide-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install sources and dependencies
        run: |
          python -m pip install -r preview/handbook-custom/scripts/requirements.txt
          npm ci --prefix preview/handbook-custom
      - name: Regenerate canonical content (no publication)
        run: npm run sync-content --prefix preview/handbook-custom
      - name: Test metadata and source contracts
        run: |
          npm run test:atlas --prefix preview/handbook-custom
          npm run test:visualizations --prefix preview/handbook-custom
          npm run test:structures --prefix preview/handbook-custom
      - name: TypeScript and Vite build, not web/site publish
        run: npm run build --prefix preview/handbook-custom
      - name: Install headless Chromium
        run: cd preview/handbook-custom && npx playwright install --with-deps chromium
      - name: Verify 144 browser scenario states and semantic layout
        shell: bash
        run: |
          set -euo pipefail
          cd preview/handbook-custom
          npm run dev -- --port 4180 > /tmp/structural-guide-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4180/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4180/ >/dev/null
          STRUCTURAL_SCREENSHOT_DIR="$PWD/evidence/structural-v3-review" \
            HANDBOOK_URL=http://127.0.0.1:4180/ \
            npm run test:structure-browser
          CONCEPT_ATLAS_SHOTS="$PWD/evidence/concept-atlas-review" \
            HANDBOOK_URL=http://127.0.0.1:4180/ \
            npm run test:mental-browser
      - name: Save visual evidence (source branch only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-v3-visual-review
          path: |
            preview/handbook-custom/evidence/structural-v3-review
            preview/handbook-custom/evidence/concept-atlas-review
          if-no-files-found: warn
          retention-days: 14
