name: FDE 05-06 interview engineering QA only
on:
  push:
    branches: [content/fde-02-04-system-data-audit-20261008]
    paths:
      - .github/workflows/fde-05-06-qa-once.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run deterministic ML and coding lab tests
        working-directory: examples/fde-interview-engineering
        run: |
          python3 -m unittest discover -s tests -v
      - name: Verify 167 indexed concepts and Q10-Q39 chapter ownership
        run: python3 scripts/verify_fde_coverage.py
      - name: Install content sync parser
        run: python3 -m pip install beautifulsoup4
      - name: Sync bilingual Reader and build React locally - DO NOT DEPLOY
        working-directory: preview/handbook-custom
        run: |
          npm install --no-audit --no-fund
          npm run sync-content
          npm run build
      - name: Validate 4 fragments, locales, search, Q24-Q39 and strict no-deploy output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          registry=json.loads(Path('web/assets/chapter-additions.json').read_text())
          root=Path('preview/handbook-custom/public/content')
          search=json.loads((root/'search-index.json').read_text())
          for chapter,frag,first,count in [
              ('01-model-api-context-foundations','fde-ml-foundations-05',24,6),
              ('09-reliability-evaluation-observability','fde-eval-foundations-05',30,4),
              ('11-data-sql-engineering','fde-coding-craft-06',34,4),
              ('08-agent-orchestration','fde-agent-coding-06',38,2),
          ]:
              assert any(x['id']==frag for x in registry[chapter]),(chapter,'registry')
              doc=json.loads((root/(chapter+'.json')).read_text())
              assert frag in doc['supplements'],(chapter,'supplement')
              assert any(x.get('href')=='#read/'+chapter+'/'+frag+'-title' for x in search),(chapter,'search')
              for lang in ('zh','en'):
                  tree=BeautifulSoup(doc[lang],'html.parser')
                  sec=tree.find(id=frag)
                  assert sec,(chapter,lang,'section missing')
                  for q in range(first,first+count):
                      assert any(h.get('id','').startswith('fde-q'+str(q)+'-') for h in sec.select('h3[id]')),(chapter,lang,q)
                  # Test each Q label and unique question-heading id without
                  # requiring a specific implementation of title sanitization.
                  hits=[h for h in sec.find_all('h3') if h.get('id','').startswith('fde-q')]
                  assert len(hits)==count,(chapter,lang,len(hits),count)
                  assert len(sec.get_text(' ',strip=True))>900,(chapter,lang,'content')
                  assert len(sec.find_all('a',href=True))>=2,(chapter,lang,'sources')
                  print(chapter,lang,count,'Q labels and sources present')
          assert not Path('.github/workflows/fde-02-04-qa-once.yml').exists()
          print('SUCCESS: 16 questions, 4 fragments, both locales and search indexed')
          PY
      - name: Commit branch-local Reader JSON/search only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/handbook-custom/public/content preview/handbook-custom/src/search-index.json preview/handbook-custom/evidence/content-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync bilingual ML/eval/coding Reader Q24-Q39 on review branch"
            git push origin HEAD:content/fde-02-04-system-data-audit-20261008
          fi
