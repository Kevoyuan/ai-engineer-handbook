name: Handbook preview build

on:
  pull_request:
    paths:
      - "preview/handbook-custom/**"
      - "DESIGN.md"
      - ".github/workflows/preview-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview/handbook-custom
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install preview dependencies
        run: npm install --no-audit --no-fund

      - name: Build React preview
        run: npm run build
