name: English language audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check web/assets/app.js
          node --check web/assets/handbook-interactions.js
          node --check web/rebuild.mjs

      - name: Check every web page for Chinese leakage in English mode
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const HAN = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/u;
          const CJK_PUNCT = /[。，：；、（）？！“”‘’＋]/u;
          const residual = JSON.parse(fs.readFileSync('web/assets/i18n-residuals.json', 'utf8'));
          const residualKeys = Object.keys(residual).sort((a, b) => b.length - a.length);
          const root = 'web';
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.isFile() && p.endsWith('.html')) files.push(p);
            }
          }
          walk(root);

          const decode = s => s
            .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
            .replace(/&nbsp;/g, ' ');

          const normalizePunctuation = value => value
            .replace(/。/g, '.')
            .replace(/，/g, ', ')
            .replace(/：/g, ': ')
            .replace(/；/g, '; ')
            .replace(/、/g, ' · ')
            .replace(/（/g, '(')
            .replace(/）/g, ')')
            .replace(/？/g, '?')
            .replace(/！/g, '!')
            .replace(/[“”]/g, '"')
            .replace(/[‘’]/g, "'")
            .replace(/＋/g, '+')
            .replace(/\s+([,.;:!?])/g, '$1')
            .replace(/([,.;:!?])(?=[A-Za-z0-9])/g, '$1 ')
            .replace(/[ \t]{2,}/g, ' ');

          const translate = value => {
            let core = decode(value).replace(/\s+/g, ' ').trim();
            if (!core) return '';
            if (residual[core]) core = residual[core];
            else {
              for (const key of residualKeys) {
                if (core.includes(key)) core = core.split(key).join(residual[key]);
              }
            }
            return normalizePunctuation(core);
          };

          const issues = [];
          const checkEnglish = (file, kind, value) => {
            if (HAN.test(value) || CJK_PUNCT.test(value)) issues.push({file, kind, value});
          };

          for (const file of files.sort()) {
            const source = fs.readFileSync(file, 'utf8');

            for (const m of source.matchAll(/data-i18n-en="([^"]*)"/g)) {
              checkEnglish(file, 'data-i18n-en', normalizePunctuation(decode(m[1])));
            }

            for (const attr of ['aria-label', 'placeholder']) {
              const re = new RegExp(`${attr}="([^"]*)"`, 'g');
              for (const m of source.matchAll(re)) {
                const original = decode(m[1]);
                if (HAN.test(original) || CJK_PUNCT.test(original)) {
                  if (!residual[original.trim()]) issues.push({file, kind: `${attr}-missing-map`, value: original});
                  else checkEnglish(file, attr, translate(original));
                }
              }
            }

            for (const m of source.matchAll(/<meta\s+name="description"\s+content="([^"]*)"/g)) {
              const original = decode(m[1]);
              if (HAN.test(original) || CJK_PUNCT.test(original)) {
                if (!residual[original.trim()]) issues.push({file, kind: 'meta-description-missing-map', value: original});
                else checkEnglish(file, 'meta-description', translate(original));
              }
            }

            // Full pages use BODY; standalone chapter fragments fall back to the entire source.
            let body = source.match(/<body\b[^>]*>([\s\S]*?)<\/body>/i)?.[1] || source;
            body = body
              .replace(/<script[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style[\s\S]*?<\/style>/gi, ' ')
              .replace(/<span\b([^>]*\bclass="[^"]*\bi18n-text\b[^"]*"[^>]*)>([\s\S]*?)<\/span>/gi,
                (all, attrs) => {
                  const m = attrs.match(/data-i18n-en="([^"]*)"/i);
                  return m ? normalizePunctuation(decode(m[1])) : all;
                })
              .replace(/<[^>]+>/g, '\n');

            for (const raw of body.split(/\n+/)) {
              const value = translate(raw);
              if (value) checkEnglish(file, 'visible-text', value);
            }
          }

          console.log(`Audited ${files.length} HTML pages/fragments.`);
          if (issues.length) {
            console.error(`Found ${issues.length} English-mode leakage issue(s):`);
            for (const x of issues) console.error(`${x.file}\t${x.kind}\t${x.value}`);
            process.exit(1);
          }
          console.log('PASS: English mode contains no Han characters or Chinese punctuation in visible text, English i18n values, aria labels, placeholders, or meta descriptions.');
          NODE
