name: Build Graph Query Chapter Once

on:
  push:
    branches:
      - content/binance-ai-agent-interview-graph-2026-10-11

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated graph]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/binance-ai-agent-interview-graph-2026-10-11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - name: Install HTML parser
        run: python3 -m pip install beautifulsoup4
      - name: Rebuild legacy index
        run: node web/rebuild.mjs
      - name: Install React dependencies
        working-directory: preview/handbook-custom
        run: npm ci
      - name: Rebuild bilingual Reader and search
        working-directory: preview/handbook-custom
        run: npm run sync-content
      - name: Publish React production site
        working-directory: preview/handbook-custom
        run: npm run publish:web
      - name: Validate output structure
        run: node web/validate.mjs
      - name: Verify graph query section and search
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const base='web/site/content/';
          const c=JSON.parse(fs.readFileSync(base+'02-enterprise-retrieval.json'));
          const search=JSON.parse(fs.readFileSync(base+'search-index.json'));
          if(!c.zh.includes('graph-query-governance') || !c.en.includes('graph-query-governance')) throw Error('Missing graph diagram in either language');
          if(!c.zh.includes('fig-2-g1') || !c.en.includes('fig-2-g2')) throw Error('Missing graph figures');
          if(!c.supplements.includes('graph-query-governance')) throw Error('Manifest did not register graph query supplement');
          if(!search.some(x=>String(x.href).includes('graph-query-governance'))) throw Error('No graph query search entry');
          console.log('Graph query supplement, locales and search present.');
          EOF
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web preview/handbook-custom/src preview/handbook-custom/public preview/handbook-custom/evidence/content-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: generate graph-query handbook output [generated graph]"
          git push origin HEAD:content/binance-ai-agent-interview-graph-2026-10-11
