name: Verify and publish compact Reader controls

on:
  push:
    branches:
      - fix/jev-remove-playback-controls

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jev-remove-playback-controls
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React dependencies
        working-directory: preview/handbook-custom
        run: npm install --no-audit --no-fund
      - name: Build React
        working-directory: preview/handbook-custom
        run: npm run build
      - name: Install Chromium
        working-directory: preview/handbook-custom
        run: npx playwright install --with-deps chromium
      - name: Test Jev static arrows and direct Reader controls
        working-directory: preview/handbook-custom
        run: |
          npm run dev -- --port 4180 > /tmp/handbook-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/ >/dev/null; then break; fi
            sleep 2
          done
          node evidence/jev-flow-comparison.cjs
          node evidence/reader-direct-actions.cjs
          npm run test:ui
      - name: Publish updated web/site
        working-directory: preview/handbook-custom
        run: npm run publish:web
      - name: Commit production artifact
        shell: bash
        run: |
          set -euo pipefail
          git add -A web/site
          if git diff --cached --quiet; then
            echo "Published output unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish static Jev diagram and direct Reader links"
          git push origin HEAD:fix/jev-remove-playback-controls
