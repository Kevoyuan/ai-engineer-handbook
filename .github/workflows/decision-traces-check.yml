name: Decision Trace V2 source and browser verification
on:
  push:
    branches:
      - design/decision-traces-ch03-04-08-20261009

permissions:
  contents: read

concurrency:
  group: decision-traces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install content tools and locked web dependencies
        run: |
          python -m pip install -r preview/handbook-custom/scripts/requirements.txt
          npm ci --prefix preview/handbook-custom
      - name: Synchronize canonical content
        run: npm run sync-content --prefix preview/handbook-custom
      - name: Validate chapter registry and existing labs
        run: |
          npm run test:atlas --prefix preview/handbook-custom
          npm run test:visualizations --prefix preview/handbook-custom
      - name: Typecheck and build (no publish:web)
        run: npm run build --prefix preview/handbook-custom
      - name: Install Chromium
        run: cd preview/handbook-custom && npx playwright install --with-deps chromium
      - name: Run bilingual decision-trace browser regression
        shell: bash
        run: |
          set -euo pipefail
          cd preview/handbook-custom
          npm run dev -- --port 4180 >/tmp/atlas-decision-traces-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4180/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4180/ >/dev/null
          HANDBOOK_URL=http://127.0.0.1:4180/ npm run test:decision-traces
