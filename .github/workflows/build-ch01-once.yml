name: Build Chapter 01 once

on:
  push:
    branches:
      - content/ch01-llm-genai-foundations-2026-10-04

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated ch01]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ch01-llm-genai-foundations-2026-10-04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - run: python3 -m pip install beautifulsoup4
      - run: node web/rebuild.mjs
      - working-directory: preview/handbook-custom
        run: npm ci
      - working-directory: preview/handbook-custom
        run: npm run sync-content
      - working-directory: preview/handbook-custom
        run: npm run publish:web
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web preview/handbook-custom/src preview/handbook-custom/public preview/handbook-custom/evidence/content-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: finalize Chapter 01 web build [generated ch01]"
          git push origin HEAD:content/ch01-llm-genai-foundations-2026-10-04
