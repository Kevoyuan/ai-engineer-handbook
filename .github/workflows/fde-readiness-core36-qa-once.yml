name: FDE core 36 editorial readiness audit QA — no deployment
on:
  push:
    branches: [content/fde-02-04-system-data-audit-20261008]
    paths: [.github/workflows/fde-readiness-core36-qa-once.yml]
permissions:
  contents: write
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - name: Verify all 167 location signals and 36 six-factor manual review records
        run: |
          python3 scripts/verify_fde_coverage.py
          python3 scripts/verify_fde_readiness.py
      - name: Run 27 deterministic coding/security toy tests
        working-directory: examples/fde-interview-engineering
        run: python3 -m unittest discover -s tests -v
      - name: Run original enterprise order walking-skeleton tests
        working-directory: examples/fde-order-copilot
        run: python3 -m unittest discover -s tests -v
      - name: Install preview build dependencies and parser
        run: |
          python3 -m pip install beautifulsoup4
          cd preview/handbook-custom
          npm install --no-audit --no-fund
      - name: Sync Reader and build React locally — never publish web/site or Vercel
        working-directory: preview/handbook-custom
        run: |
          npm run sync-content
          npm run build
      - name: Validate bilingual Reader, index, four rounds and 36 drill panels
        run: |
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import json
          chapter='12-fde-customer-delivery'
          frag='fde-readiness-audit-08'
          base=Path('preview/handbook-custom/public/content')
          registry=json.loads(Path('web/assets/chapter-additions.json').read_text())
          assert any(x['id']==frag for x in registry[chapter])
          index=json.loads((base/'search-index.json').read_text())
          assert any(x.get('href')=='#read/'+chapter+'/'+frag+'-title' for x in index)
          payload=json.loads((base/(chapter+'.json')).read_text())
          assert frag in payload['supplements']
          for language in ('zh','en'):
              dom=BeautifulSoup(payload[language],'html.parser')
              root=dom.find(id=frag)
              assert root is not None,(language,'section')
              assert root.find(id=frag+'-title'),(language,'title')
              assert len(root.select('details'))==40,(language,'36 drills and 4 rounds')
              text=root.get_text(' ',strip=True)
              assert len(text)>4000,(language,'localization length')
              for i in range(1,37):
                  assert f'R{i:02d}' in text,(language,'missing drill',i)
              assert len(root.select('a[href*="handbook/chapters/"]'))==36,(language,'source link')
              print(language,'36 drills, 4 rounds, owner links, bilingual content verified')
          print('PASS: production site intentionally not generated/published')
          PY
      - name: Commit ONLY review-branch bilingual Reader JSON/search, not web/site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/handbook-custom/public/content preview/handbook-custom/src/search-index.json preview/handbook-custom/evidence/content-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync draft-only bilingual FDE core36 readiness Reader"
            git fetch origin content/fde-02-04-system-data-audit-20261008
            git rebase origin/content/fde-02-04-system-data-audit-20261008
            git push origin HEAD:content/fde-02-04-system-data-audit-20261008
          fi
