name: Verify and publish compact lifecycle simulator

on:
  push:
    branches:
      - fix/compact-skill-lifecycle-simulator

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-skill-lifecycle-simulator

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application dependencies
        working-directory: preview/handbook-custom
        run: npm install --no-audit --no-fund

      - name: Install browser
        working-directory: preview/handbook-custom
        run: npx playwright install --with-deps chromium

      - name: Build and verify simulator
        working-directory: preview/handbook-custom
        run: |
          npm run build
          npm run dev -- --port 4181 > /tmp/handbook-4181.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4181/ > /dev/null; then break; fi
            sleep 2
          done
          node evidence/simulator-compact.cjs
          node evidence/bento/check.cjs

      - name: Publish application to web/site
        working-directory: preview/handbook-custom
        run: npm run publish:web

      - name: Commit production artifact
        shell: bash
        run: |
          set -euo pipefail
          git add -A web/site
          if git diff --cached --quiet; then
            echo "Production artifact unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish compact lifecycle simulator"
          git push origin HEAD:fix/compact-skill-lifecycle-simulator
