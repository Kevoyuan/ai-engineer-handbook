name: FDE 02-04 source and bilingual build QA (no deployment)
on:
  push:
    branches: [content/fde-02-04-system-data-audit-20261008]
    paths:
      - .github/workflows/fde-02-04-qa-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install BeautifulSoup
        run: python3 -m pip install beautifulsoup4
      - name: Sync bilingual Reader and build React locally - do NOT deploy to Vercel
        working-directory: preview/handbook-custom
        run: |
          npm install --no-audit --no-fund
          npm run sync-content
          npm run build
      - name: Verify source coverage, bilingual QA fragments, search and markdown
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from bs4 import BeautifulSoup
          audit=Path('handbook/references/fde-2026-coverage-audit.md').read_text()
          data=re.findall(r'^\| .*? \| .*? \| CH\d\d \| ([HBN]) \| .*? \| P[01] \|',audit,re.M)
          assert len(data)==167,(len(data),'coverage inventory')
          assert (data.count('H'),data.count('B'),data.count('N'))==(76,34,57)
          for path,marker in [
              ('handbook/chapters/10-serving-deployment-ai-platform.md','## 10.26'),
              ('handbook/chapters/11-data-sql-engineering.md','## 11.10')
          ]:
              text=Path(path).read_text().split(marker)[-1]
              assert text.count('```')%2==0,(path,'code fences')
              assert '\\`' not in text,(path,'escaped markup')
          registry=json.loads(Path('web/assets/chapter-additions.json').read_text())
          cases=[
              ('10-serving-deployment-ai-platform','fde-system-design-02','fde-q10-vpc',7),
              ('11-data-sql-engineering','fde-databricks-03','fde-q17-auto-cdc',7),
              ('12-fde-customer-delivery','fde-coverage-audit-04','fde-audit-priority',1),
          ]
          root=Path('preview/handbook-custom/public/content')
          search=json.loads((root/'search-index.json').read_text())
          count=0
          for chapter,id,anchor,questions in cases:
              assert any(x['id']==id for x in registry[chapter]),(chapter,'registry')
              payload=json.loads((root/(chapter+'.json')).read_text())
              assert id in payload['supplements'],(chapter,'supplement')
              assert any(x['href']=='#read/'+chapter+'/'+id+'-title' for x in search),(chapter,'search')
              for language in ('zh','en'):
                  doc=BeautifulSoup(payload[language],'html.parser')
                  section=doc.find(id=id)
                  assert section and section.find(id=anchor),(chapter,language,'anchor')
                  if questions>1: assert len(section.select('h3[id^="fde-q"]'))==questions,(chapter,language,'questions')
                  if language=='en':
                      text=section.get_text(' ',strip=True)
                      assert len(text)>1100,(chapter,language,'text')
                  print(chapter,language,'OK')
              count+=questions
          assert count==15,count
          print('PASS: 167 audited topic signals, 14 interview drills + CH12 guide, bilingual Reader and Search')
          PY
      - name: Commit branch-local generated Reader and Search only (no web/site and no deployment)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/handbook-custom/public/content preview/handbook-custom/src/search-index.json preview/handbook-custom/evidence/content-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync branch-only bilingual FDE 02-04 reader and search"
            git push origin HEAD:content/fde-02-04-system-data-audit-20261008
          fi
