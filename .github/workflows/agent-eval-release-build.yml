name: Build Agent Evaluation Atlas release artifacts
on:
  push:
    branches:
      - content/agent-evaluation-role-map-20261023

permissions:
  contents: write

concurrency:
  group: agent-eval-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: preview/handbook-custom/package-lock.json
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install -r preview/handbook-custom/scripts/requirements.txt
          npm ci --prefix preview/handbook-custom
      - name: Generate bilingual Reader and Search payloads
        run: npm run sync-content --prefix preview/handbook-custom
      - name: Validate Atlas
        run: |
          npm run test:atlas --prefix preview/handbook-custom
          npm run test:visualizations --prefix preview/handbook-custom
          npm run test:structures --prefix preview/handbook-custom
      - name: Compile React app
        run: npm run build --prefix preview/handbook-custom
      - name: Generate production web/site
        run: npm run publish:web --prefix preview/handbook-custom
      - name: Validate published web layout
        run: |
          node web/validate.mjs
          node --check web/rebuild.mjs
      - name: Commit generated artifacts back to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A preview/handbook-custom/public/content preview/handbook-custom/src/search-index.json preview/handbook-custom/src/chapters.json web/site
          if git diff --cached --quiet; then
            echo "No generated diff"
          else
            git commit -m "chore(site): publish rebuilt Agent evaluation chapter"
            git push origin HEAD:content/agent-evaluation-role-map-20261023
          fi
