name: One-time Jev Reader publish generation
on:
  push:
    branches: [content/jev-agent-loop-checkpoints-20261008]
    paths:
      - .github/workflows/jev-publish-once.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install HTML transform dependencies
        run: python3 -m pip install beautifulsoup4
      - name: Generate bilingual reader, index and published site
        working-directory: preview/handbook-custom
        run: |
          npm install --no-audit --no-fund
          npm run sync-content
          npm run build
          npm run publish:web
      - name: Assert the newly generated content is in both reader builds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for folder in ('preview/handbook-custom/public/content', 'web/site/content'):
              page=json.loads((Path(folder)/'06-skills-routing.json').read_text())
              index=json.loads((Path(folder)/'search-index.json').read_text())
              assert all('jev-agent-loop-gates' in page[language] for language in ('zh','en')), folder
              assert any('Agent loop: five bounded decision checkpoints' in x.get('titleEn','') for x in index), folder
              print(folder, 'zh+en section and search OK')
          PY
      - name: Commit generated deploy artifacts to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/handbook-custom/public/content web/site
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate bilingual Jev reader and published Atlas"
            git push origin HEAD:content/jev-agent-loop-checkpoints-20261008
          fi
