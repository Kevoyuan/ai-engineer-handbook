name: Validate and publish Jev connector motion

on:
  push:
    branches:
      - feat/jev-arrows-and-flow-motion

permissions:
  contents: write

jobs:
  test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jev-arrows-and-flow-motion

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: preview/handbook-custom
        run: npm install --no-audit --no-fund

      - name: Build React preview
        working-directory: preview/handbook-custom
        run: npm run build

      - name: Install Chromium
        working-directory: preview/handbook-custom
        run: npx playwright install --with-deps chromium

      - name: Test arrows, animation, keyboard and responsive layouts
        working-directory: preview/handbook-custom
        run: |
          npm run dev -- --port 4180 > /tmp/handbook-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/ >/dev/null; then break; fi
            sleep 2
          done
          node evidence/jev-flow-comparison.cjs

      - name: Publish web/site
        working-directory: preview/handbook-custom
        run: npm run publish:web

      - name: Commit regenerated site
        shell: bash
        run: |
          set -euo pipefail
          git add -A web/site
          if git diff --cached --quiet; then
            echo "Published site unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish finite Jev connector animations"
          git push origin HEAD:feat/jev-arrows-and-flow-motion
