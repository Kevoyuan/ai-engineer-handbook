<section id="eval-state-reconciliation" aria-labelledby="eval-state-reconciliation-title">
<h2 class="sub" id="eval-state-reconciliation-title"><span class="i18n-text" data-i18n-zh="Agent 评测：轨迹与真实状态 · §9.26.3" data-i18n-en="Agent evaluation: trajectory and actual state · §9.26.3">Agent 评测：轨迹与真实状态 · §9.26.3</span></h2>
<p><span class="i18n-text" data-i18n-zh="分别检查必要证据召回、答案支持、工具轨迹、后端状态和权限门禁，并衡量多次成功率、延迟及成本。合理答案不必逐字一致。超时后区分未执行、已执行但响应丢失和结果未知；结果未知先对账再决定是否重试。" data-i18n-en="Check required evidence recall, answer support, tool trajectory, backend state and authorization separately, and measure repeated success, latency and cost. Valid answers need not use identical wording. After a timeout distinguish no action, completed action with a lost response, and unknown outcome; reconcile unknown outcomes before retrying.">分别检查必要证据召回、答案支持、工具轨迹、后端状态和权限门禁，并衡量多次成功率、延迟及成本。合理答案不必逐字一致。超时后区分未执行、已执行但响应丢失和结果未知；结果未知先对账再决定是否重试。</span></p>
</section>
