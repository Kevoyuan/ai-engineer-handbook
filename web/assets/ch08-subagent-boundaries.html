<h2 class="sub" id="subagent-boundaries-title"><span class="i18n-text" data-i18n-zh="子代理的上下文边界 · §8.12.5" data-i18n-en="Subagent context boundaries · §8.12.5">子代理的上下文边界 · §8.12.5</span></h2>
<p><span class="i18n-text" data-i18n-zh="独立研究、清晰接口或黑盒验证可隔离；共享大量状态的计划、实现和测试可能更适合一个循环。先以单循环及按需加载为对照，逐个合并耦合步骤，比较真实端到端结果、授权不变量、多次成功率、延迟与成本。工具执行层仍负责权限和硬约束。" data-i18n-en="Isolate independent research, clean interfaces or black-box verification. Planning, implementation and tests that share substantial state may fit one loop better. Compare against a single loop with on-demand loading, merge coupled steps incrementally, and measure end-to-end outcomes, authorization invariants, repeated success, latency and cost. The tool layer still enforces permissions and hard constraints.">独立研究、清晰接口或黑盒验证可隔离；共享大量状态的计划、实现和测试可能更适合一个循环。先以单循环及按需加载为对照，逐个合并耦合步骤，比较真实端到端结果、授权不变量、多次成功率、延迟与成本。工具执行层仍负责权限和硬约束。</span></p>
